# Render Blueprint 配置 - 全栈部署（前端 Nginx + 后端 Node/Python）
# 使用方法：在 Render Dashboard → New → Blueprint → 选择仓库和此文件
services:
  # 前端服务：React + Vite 静态文件 + Nginx 反向代理
  - type: web
    name: lidar-frontend
    env: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # 从后端服务动态获取完整 URL（如 https://lidar-backend-xxxx.onrender.com）
      # 供 nginx.conf 中的 ${BACKEND_URL} 使用
      - key: BACKEND_URL
        fromService:
          type: web
          name: lidar-backend
          property: url

  # 后端服务：Node.js (Express) + Python (laspy/open3d) 混合服务
  - type: web
    name: lidar-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
    # 持久化磁盘：存储点云处理临时文件和输出
    disk:
      name: backend-output
      mountPath: /app/output
      sizeGB: 10
