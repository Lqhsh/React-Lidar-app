# CI 构建检查 - 验证前端可编译、后端 Python 语法正确
# 部署由 Zeabur 自动完成（zeabur.yaml 中 autoDeploy: true）
name: CI Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tsc + vite build)
        run: npm run build

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check backend Python syntax
        working-directory: backend
        run: |
          pip install py_compile_deps || true
          python -m py_compile main.py parse_las.py filters.py classify.py height_normalize.py tree_segment.py building_segment.py las_export.py
