# Zeabur 自动部署配置
# 文档：https://zeabur.com/docs
# 使用方式：在 Zeabur Dashboard → 新建项目 → 选择 "从配置文件创建" 或连接 GitHub 仓库
services:
  # 后端服务：Node.js (Express) + Python (laspy/open3d) 混合服务
  - name: lidar-backend
    source:
      repo: Lqhsh/React-Lidar-app
      branch: main
      path: backend
    build:
      type: docker
    run:
      command: npm start
    env:
      NODE_ENV: production
      PORT: "3001"
    # 持久化存储（存储点云处理临时文件）
    volumes:
      - mountPath: /app/output
        size: 10Gi

  # 前端服务：React + Vite 静态文件 + Nginx 反向代理
  - name: lidar-frontend
    source:
      repo: Lqhsh/React-Lidar-app
      branch: main
      path: .
    build:
      type: docker
    # 关键：将后端服务的公网 URL 注入前端 Nginx 配置
    env:
      NODE_ENV: production
      # 在 Zeabur Dashboard 中需手动设置此变量，指向后端服务的公网 URL
      # 格式：https://lidar-backend-xxxx.zeabur.app
      BACKEND_URL: ""
