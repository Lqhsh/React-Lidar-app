# Zeabur 自动部署配置
# 文档：https://zeabur.com/docs
# 使用方式：在 Zeabur Dashboard → 新建项目 → 选择 "从配置文件创建" 或连接 GitHub 仓库
services:
  # 后端服务：FastAPI + Python（laspy/open3d 点云处理）
  - name: lidar-backend
    source:
      repo: Lqhsh/React-Lidar-app
      branch: main
      path: backend
    build:
      type: docker
    run:
      # 先运行 bootstrap 脚本从 GitHub Release 下载内置 LAS 数据，再启动 FastAPI
      command: sh -c "python builtin_data_bootstrap.py ; uvicorn main:app --host 0.0.0.0 --port 8080"
    env:
      PORT: "8080"
      HOST: "0.0.0.0"
      # 显式指定输出目录，匹配下面 volume 挂载点；main.py 会读取此 env
      OUTPUT_DIR: "/app/output"
      # 显式指定内置示例数据目录，匹配下面 volume 挂载点；用户可通过 Zeabur 面板上传数据
      LOCAL_DATA_DIR: "/app/本地数据"
    # 持久化存储（存储点云处理临时文件 + 内置示例数据）
    volumes:
      - mountPath: /app/output
        size: 10Gi
      - mountPath: /app/本地数据
        size: 5Gi

  # 前端服务：React + Vite 静态文件 + Nginx 反向代理
  - name: lidar-frontend
    source:
      repo: Lqhsh/React-Lidar-app
      branch: main
      path: .
    build:
      type: docker
    # 关键：将后端服务的公网 URL 注入前端 Nginx 配置
    env:
      NODE_ENV: production
      BACKEND_URL: "https://lidar-backend.zeabur.app"
