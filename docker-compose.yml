version: '3.8'

# 本地 Docker Compose 测试配置
# 使用：docker-compose up --build
# 访问：http://localhost:8080
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # 本地 8080 → 容器 80
    depends_on:
      - backend
    environment:
      # 通过 Docker 网络服务名访问后端
      - BACKEND_URL=http://backend:3001
    networks:
      - lidar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    networks:
      - lidar-network
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - backend-output:/app/output

networks:
  lidar-network:
    driver: bridge

volumes:
  backend-output:
