version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lidar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    networks:
      - lidar-network
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - backend-output:/app/output

networks:
  lidar-network:
    driver: bridge

volumes:
  backend-output:
