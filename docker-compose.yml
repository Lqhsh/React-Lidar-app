version: '3.8'

# 本地 Docker Compose 测试配置
# 使用：docker-compose up --build
# 访问：http://localhost:8080
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # 本地 8080 → 容器 8080（nginx 监听 8080）
    depends_on:
      - backend
    environment:
      # 通过 Docker 网络服务名访问后端（后端容器内部监听 8080）
      - BACKEND_URL=http://backend:8080
    networks:
      - lidar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:8080"  # 本地 3001 → 容器 8080（便于直接调试后端 API）
    networks:
      - lidar-network
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      - backend-output:/app/output

networks:
  lidar-network:
    driver: bridge

volumes:
  backend-output:
