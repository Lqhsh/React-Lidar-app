server {
    # Zeabur 默认期望服务监听 8080 端口
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 静态资源缓存
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|gif|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端服务
    # envsubst 在容器启动时将 ${BACKEND_URL} 替换为实际后端 URL
    # 替换后 proxy_pass 变为静态字符串，Nginx 启动时即解析域名，无需运行时 resolver
    location /api/ {
        proxy_pass ${BACKEND_URL};

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # 关键：使用 $proxy_host 而非 $host，确保 Host 头是后端域名
        # Zeabur 路由层依赖 Host 头将请求转发到正确的后端服务
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSL 配置（代理到 https 后端时需要）
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        # 大文件上传支持
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # 健康检查端点
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
